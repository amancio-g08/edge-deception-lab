# Stands in for the CDN tier in front of the sensor. Same four jobs an edge
# config does in production:
#   1. set the real client IP in a header the origin trusts, overwriting
#      whatever the client sent under that name
#   2. keep the management surface off the public listener
#   3. rate limit so one scanner can't exhaust the sensor
#   4. log enough to correlate against what the sensor recorded

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # json so it can be shipped somewhere later without reparsing
    log_format edge escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"user_agent":"$http_user_agent",'
          '"referer":"$http_referer"'
        '}';

    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    sendfile      on;
    server_tokens off;

    # generous on purpose. throttling early kills the behaviour we want to see
    limit_req_zone $binary_remote_addr zone=sensor:10m rate=30r/s;
    limit_req_status 429;

    upstream sensor {
        server honeypot:8080;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # big enough for a realistic payload, small enough to not be an upload target
        client_max_body_size 64k;

        # dashboard and API are not reachable from the public listener
        location /_edl/ {
            return 404;
        }

        location / {
            limit_req zone=sensor burst=60 nodelay;

            proxy_pass http://sensor;
            proxy_http_version 1.1;

            # set, not add. anything the client sent under this name is dropped
            proxy_set_header X-Edge-Client-IP $remote_addr;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header Connection       "";

            # keep the client header order intact, the sensor fingerprints it
            proxy_pass_request_headers on;

            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
        }
    }
}
