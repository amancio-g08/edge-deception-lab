# Edge layer.
#
# Stands in for the CDN tier (Akamai / Cloudflare) in front of the sensor. Its
# job here is the same as an edge configuration's job in production:
#
#   1. Establish the true client IP and hand it to the origin in a header the
#      origin is configured to trust — and overwrite it unconditionally, so a
#      client-supplied value can never be believed.
#   2. Keep the management surface off the public listener.
#   3. Apply coarse rate limiting so a single scanner cannot exhaust the sensor.
#   4. Emit an extended access log for correlation against the sensor's own view.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Extended log: enough to correlate an nginx line with a sensor event.
    log_format edge escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"user_agent":"$http_user_agent",'
          '"referer":"$http_referer"'
        '}';

    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    sendfile      on;
    server_tokens off;

    # Coarse protection for the sensor itself. Deliberately generous: throttling
    # too early destroys the very behaviour the lab exists to observe.
    limit_req_zone $binary_remote_addr zone=sensor:10m rate=30r/s;
    limit_req_status 429;

    upstream sensor {
        server honeypot:8080;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Large enough to capture a realistic exploit payload, small enough that
        # the sensor is not a convenient upload target.
        client_max_body_size 64k;

        # The management API and dashboard are never reachable from the public
        # listener. In production this is the difference between an edge
        # hostname and an internal one.
        location /_edl/ {
            return 404;
        }

        location / {
            limit_req zone=sensor burst=60 nodelay;

            proxy_pass http://sensor;
            proxy_http_version 1.1;

            # Unconditional set, never add: whatever the client sent under this
            # name is discarded before the origin ever sees it.
            proxy_set_header X-Edge-Client-IP $remote_addr;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header Connection       "";

            # Preserve the client's own header ordering as closely as possible;
            # the sensor fingerprints it.
            proxy_pass_request_headers on;

            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
        }
    }
}
