name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r honeypot/requirements.txt
          pip install pytest httpx
      - name: Run tests
        run: python -m pytest

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tlsfront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...
      - name: Build
        run: go build ./...
